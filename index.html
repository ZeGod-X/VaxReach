<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d9488" />
<link rel="manifest" href="/manifest.webmanifest" />
<title>VaxReach — Immunisation Follow-up</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d9488'/%3E%3Cpath d='M16 8v16M10 13h12' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<style>
:root{
  --brand-50:#f0fdfa;--brand-100:#ccfbf1;--brand-500:#14b8a6;--brand-600:#0d9488;--brand-700:#0f766e;
  --ink-900:#0f172a;--ink-700:#334155;--ink-600:#475569;--ink-500:#64748b;--ink-400:#94a3b8;--ink-300:#cbd5e1;
  --line-100:#f1f5f9;--line-200:#e2e8f0;
  --surface:#fff;--surface-soft:#f8fafc;--surface-muted:#f1f5f9;
  --ok-50:#ecfdf5;--ok-600:#059669;--ok-700:#047857;
  --warn-50:#fffbeb;--warn-600:#d97706;--warn-700:#b45309;
  --danger-50:#fef2f2;--danger-600:#dc2626;--danger-700:#b91c1c;
  --info-50:#eff6ff;--info-700:#1d4ed8;
  --purple-50:#f5f3ff;--purple-700:#6d28d9;
  --r-sm:6px;--r-md:8px;--r-lg:12px;--r-full:999px;
  --shadow-xs:0 1px 2px rgba(15,23,42,.04);
  --shadow-sm:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --sidebar-w:240px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:"Inter","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.55;color:var(--ink-900);background:var(--surface);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.22;letter-spacing:-.015em}
p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}
a{color:var(--brand-700);text-decoration:none}
:focus-visible{outline:2px solid var(--brand-600);outline-offset:2px;border-radius:4px}

.muted{color:var(--ink-500)}.small{font-size:.82rem}.tiny{font-size:.74rem}.bold{font-weight:600}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mt12{margin-top:12px}.mt16{margin-top:16px}
.divider{height:1px;background:var(--line-200);margin:16px 0}
.nowrap{white-space:nowrap}
.center{text-align:center}

.icon{width:18px;height:18px;flex:0 0 auto;display:inline-block;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-sm{width:15px;height:15px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--brand-600);color:#fff;border-radius:var(--r-sm);padding:9px 16px;font-weight:600;font-size:.85rem;transition:background .15s;white-space:nowrap;border:1px solid var(--brand-600)}
.btn:hover{background:var(--brand-700);border-color:var(--brand-700)}
.btn .icon{width:16px;height:16px}
.btn.ghost{background:var(--surface);color:var(--ink-700);border-color:var(--line-200)}
.btn.ghost:hover{background:var(--surface-soft);border-color:var(--ink-300)}
.btn.soft{background:var(--brand-50);color:var(--brand-700);border-color:var(--brand-100)}
.btn.danger{background:var(--danger-600);border-color:var(--danger-600)}
.btn.sm{padding:6px 11px;font-size:.78rem}
.btn.sm .icon{width:14px;height:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{background:transparent;border:1px solid transparent;border-radius:var(--r-sm);width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-600)}
.icon-btn:hover{background:var(--surface-muted)}

label.field{display:block;margin-bottom:14px}
label.field>span{display:block;font-size:.78rem;font-weight:600;color:var(--ink-700);margin-bottom:5px}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=date],input[type=number],select,textarea{width:100%;padding:9px 12px;border:1px solid var(--line-200);border-radius:var(--r-sm);background:var(--surface);color:var(--ink-900);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand-600);box-shadow:0 0 0 3px rgba(13,148,136,.12)}
textarea{resize:vertical;min-height:44px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}

.card{background:var(--surface);border:1px solid var(--line-200);border-radius:var(--r-lg);box-shadow:var(--shadow-xs);overflow:hidden}
.card-pad{padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line-200);flex-wrap:wrap}
.card-head h3{font-size:.92rem;font-weight:600;display:flex;align-items:center;gap:8px}
.card-body{padding:18px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:var(--r-full);font-size:.71rem;font-weight:600;white-space:nowrap}
.badge .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--ok-50);color:var(--ok-700)}
.badge.warn{background:var(--warn-50);color:var(--warn-700)}
.badge.danger{background:var(--danger-50);color:var(--danger-700)}
.badge.info{background:var(--info-50);color:var(--info-700)}
.badge.gray{background:var(--surface-muted);color:var(--ink-600)}
.badge.brand{background:var(--brand-50);color:var(--brand-700)}
.badge.violet{background:var(--purple-50);color:var(--purple-700)}

.shell{display:flex;min-height:100dvh;--accent:var(--brand-600);--accent-700:var(--brand-700);--accent-50:var(--brand-50)}
.shell[data-role="worker"]{--accent:#2563eb;--accent-700:#1d4ed8;--accent-50:#eff6ff}
.shell[data-role="child"]{--accent:#7c3aed;--accent-700:#6d28d9;--accent-50:#f5f3ff}
.sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--surface);border-right:1px solid var(--line-200);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100dvh;overflow-y:auto;z-index:60}
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;font-weight:700;font-size:1rem;letter-spacing:-.02em}
.side-brand small{display:block;font-size:.62rem;font-weight:600;color:var(--ink-500);letter-spacing:.05em;text-transform:uppercase;margin-top:1px}
.logo-mark{width:34px;height:34px;border-radius:var(--r-md);display:grid;place-items:center;flex:0 0 34px;overflow:hidden}
.logo-mark svg{width:100%;height:100%;display:block}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);color:var(--ink-600);font-weight:500;font-size:.85rem;text-align:left;width:100%;transition:background .12s}
.nav-item .icon{width:17px;height:17px;color:var(--ink-400)}
.nav-item:hover{background:var(--surface-muted);color:var(--ink-900)}
.nav-item.active{background:var(--accent-50);color:var(--accent-700);font-weight:600}
.nav-item.active .icon{color:var(--accent-700)}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line-200)}
.side-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-sm);background:var(--surface-soft);border:1px solid var(--line-200);width:100%;text-align:left;cursor:pointer}
.side-user:hover{border-color:var(--accent);background:var(--accent-50)}
.avatar{width:34px;height:34px;border-radius:var(--r-md);background:linear-gradient(140deg,var(--accent),var(--accent-700));display:grid;place-items:center;color:#fff;font-weight:700;font-size:.75rem;flex:0 0 34px}
.side-user .nm{font-size:.8rem;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-user .rl{font-size:.68rem;color:var(--ink-500);text-transform:capitalize}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 24px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line-200)}
.tb-title{font-size:.95rem;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-right{display:flex;align-items:center;gap:10px}
.role-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-full);font-size:.72rem;font-weight:600;background:var(--accent-50);color:var(--accent-700)}
.role-pill .icon{width:13px;height:13px}
.tb-avatar{display:flex;align-items:center;gap:8px;padding:3px 11px 3px 3px;border-radius:var(--r-full);background:var(--surface-soft);border:1px solid var(--line-200);cursor:pointer}
.tb-avatar .avatar{width:28px;height:28px;flex:0 0 28px;border-radius:var(--r-sm);font-size:.68rem}
.tb-avatar span{font-size:.8rem;font-weight:600;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.content{padding:24px;width:100%;max-width:1340px;margin:0 auto;flex:1}

.menu-btn{display:none}
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:55;display:none}
.scrim.show{display:block}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .24s ease;box-shadow:var(--shadow-sm)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:inline-flex}
  .topbar{padding:10px 16px}
  .role-pill{display:none}
  .content{padding:16px}
}
@media(min-width:901px){.scrim{display:none!important}}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line-200);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--shadow-xs)}
.kpi .k-top{margin-bottom:10px}
.kpi .k-ic{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--k-soft);color:var(--k)}
.kpi .k-ic .icon{width:17px;height:17px}
.kpi .k-val{font-size:1.4rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi .k-lbl{font-size:.75rem;color:var(--ink-500);margin-top:2px;font-weight:500}
.kpi.teal{--k:var(--brand-700);--k-soft:var(--brand-50)}
.kpi.amber{--k:var(--warn-700);--k-soft:var(--warn-50)}
.kpi.red{--k:var(--danger-700);--k-soft:var(--danger-50)}
.kpi.blue{--k:var(--info-700);--k-soft:var(--info-50)}
.kpi.green{--k:var(--ok-700);--k-soft:var(--ok-50)}
.kpi.violet{--k:var(--purple-700);--k-soft:var(--purple-50)}

.bar-row{display:grid;grid-template-columns:120px 1fr 48px;gap:10px;align-items:center;padding:6px 0}
.bar-track{height:8px;border-radius:var(--r-full);background:var(--surface-muted);overflow:hidden}
.bar-fill{height:100%;border-radius:var(--r-full);background:var(--brand-600)}
.bar-fill.warn{background:var(--warn-600)}
.bar-fill.danger{background:var(--danger-600)}
.bar-val{font-size:.78rem;font-weight:600;text-align:right}

.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:640px}
table.tbl th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-500);font-weight:600;padding:10px 14px;background:var(--surface-soft);border-bottom:1px solid var(--line-200);white-space:nowrap}
table.tbl td{padding:12px 14px;border-bottom:1px solid var(--line-100);font-size:.85rem;vertical-align:middle}
table.tbl tbody tr:hover{background:var(--surface-soft)}
.tbl .t-strong{font-weight:600}

.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-100)}
.list-row:last-child{border-bottom:none}
.list-row .lr-main{flex:1;min-width:0}
.list-row .lr-t{font-weight:600;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row .lr-s{font-size:.75rem;color:var(--ink-500)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .grow{flex:1;min-width:160px}
.empty{padding:40px 20px;text-align:center;color:var(--ink-500)}

.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px)}
.modal{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:540px;max-height:92dvh;overflow-y:auto;box-shadow:0 20px 60px rgba(15,23,42,.2)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line-200)}
.modal-head h3{font-size:1rem;font-weight:600}
.modal-body{padding:20px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,24px);background:var(--ink-900);color:#fff;padding:12px 20px;border-radius:var(--r-md);font-size:.85rem;font-weight:500;box-shadow:0 12px 32px rgba(15,23,42,.24);opacity:0;pointer-events:none;transition:.24s;z-index:300;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{background:var(--brand-700)}
#toast.err{background:var(--danger-700)}

.land{min-height:100dvh}
.land-nav{display:flex;align-items:center;gap:16px;padding:14px 24px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line-200);position:sticky;top:0;z-index:40;flex-wrap:wrap}
.land-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
.land-brand .logo-mark{width:32px;height:32px;flex:0 0 32px}
.land-nav-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
.land-hero{padding:72px 24px 60px;max-width:900px;margin:0 auto;text-align:center}
.land-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-700);background:var(--brand-50);border:1px solid var(--brand-100);padding:4px 12px;border-radius:var(--r-full);margin-bottom:22px}
.land-hero h1{font-size:clamp(2rem,4.5vw,3rem);font-weight:800;letter-spacing:-.03em;line-height:1.08;max-width:16ch;margin:0 auto 20px}
.land-hero h1 .accent{color:var(--brand-600)}
.land-lead{font-size:1.02rem;line-height:1.65;color:var(--ink-600);max-width:52ch;margin:0 auto 32px}
.land-hero-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.land-section{padding:48px 24px;max-width:1000px;margin:0 auto}
.land-section-title{font-size:1.4rem;font-weight:700;margin-bottom:16px;text-align:center}
.land-demo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.land-demo-card{display:flex;flex-direction:column;gap:6px;padding:16px;background:var(--surface);border:1px solid var(--line-200);border-radius:var(--r-md);text-align:left;cursor:pointer}
.land-demo-card:hover{border-color:var(--brand-200)}
.land-demo-card strong{font-size:.88rem;font-weight:600}
.land-demo-card code{font-size:.74rem;font-family:ui-monospace,monospace;color:var(--ink-700);background:var(--surface-muted);padding:2px 6px;border-radius:4px;align-self:flex-start}
.land-nav-links{display:flex;align-items:center;gap:17px;margin-left:auto}
.land-nav-links a{font-size:.8rem;font-weight:600;color:var(--ink-600)}
.land-nav-links a:hover{color:var(--brand-700)}
.land-section-intro{max-width:66ch;margin:0 auto 22px;text-align:center;color:var(--ink-600);line-height:1.65}
.land-info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.land-info-card{padding:18px;background:var(--surface);border:1px solid var(--line-200);border-radius:var(--r-md);box-shadow:var(--shadow-xs)}
.land-info-card h3{font-size:.92rem;font-weight:700;margin:10px 0 6px}
.land-info-card p{font-size:.81rem;color:var(--ink-600);line-height:1.6}
.land-info-icon{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--brand-50);color:var(--brand-700)}
.land-info-icon .icon{width:18px;height:18px}
.land-step-no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--brand-600);color:#fff;font-size:.78rem;font-weight:700}
.land-demo-note{padding:16px 18px;border:1px solid var(--line-200);border-left:3px solid var(--warn-600);border-radius:var(--r-md);background:var(--surface-soft);color:var(--ink-600);font-size:.82rem;line-height:1.65}
.land-demo-note strong{color:var(--ink-900)}
.land-bottom-cta{text-align:center;padding-top:8px}
#about,#how-it-works,#roles,#features,#demo-accounts,#demo-notice{scroll-margin-top:84px}
@media(max-width:760px){.land-nav-links{order:3;width:100%;justify-content:center;margin:0;gap:13px;flex-wrap:wrap}.land-nav-actions{margin-left:auto}}
.land-footer{border-top:1px solid var(--line-200);padding:28px 24px;text-align:center;color:var(--ink-500);font-size:.8rem;line-height:1.6;background:var(--surface-soft)}
.camp-card{display:block;width:100%;padding:0;text-align:left;color:inherit;background:var(--surface);border:1px solid var(--line-200);cursor:pointer;transition:border-color .15s,box-shadow .15s}
.camp-card:hover{border-color:var(--brand-500);box-shadow:var(--shadow-sm)}
.camp-card:focus-visible{outline:2px solid var(--brand-600);outline-offset:2px}
.camp-open-hint{margin-top:12px;color:var(--brand-700);font-size:.75rem;font-weight:600}
.camp-details-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.camp-detail{padding:12px;border:1px solid var(--line-200);border-radius:var(--r-sm);background:var(--surface-soft)}
.camp-detail .k{font-size:.68rem;color:var(--ink-500);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.camp-detail .v{margin-top:3px;font-size:.85rem;font-weight:600;overflow-wrap:anywhere}
.camp-detail.wide{grid-column:1/-1}
.dose-status{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.profile-panel{max-width:1000px}
.profile-summary{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line-200)}
.profile-person{display:flex;align-items:center;gap:12px;min-width:0}
.profile-avatar{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--brand-50);color:var(--brand-700);font-weight:700;font-size:1rem;flex:0 0 48px}
.profile-summary h3{font-size:1rem}
.profile-summary .muted{font-size:.8rem;overflow-wrap:anywhere}
.profile-section{margin-top:20px}
.profile-section h3{font-size:.9rem;margin-bottom:12px}
.profile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 12px}
.profile-item{min-width:0;padding:11px 13px;border:1px solid var(--line-200);border-radius:var(--r-sm);background:var(--surface-soft)}
.profile-label{font-size:.68rem;color:var(--ink-500);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.profile-value{margin-top:4px;font-size:.85rem;font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}
.profile-edit-field{margin:0!important}
.profile-edit-field>span{font-size:.68rem!important;text-transform:uppercase;letter-spacing:.04em}
.profile-edit-field input,.profile-edit-field textarea{margin-top:4px}
.profile-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line-200)}
@media(max-width:640px){.profile-grid{grid-template-columns:1fr}.profile-summary{align-items:flex-start}}
@media(max-width:560px){.camp-details-grid{grid-template-columns:1fr}.camp-detail.wide{grid-column:auto}}

.auth{min-height:100dvh;display:grid;grid-template-columns:1fr 1fr}
.auth-brand{background:linear-gradient(160deg,var(--brand-700),var(--brand-600));color:#fff;padding:40px 44px;display:flex;flex-direction:column;justify-content:space-between}
.auth-brand .logo-mark{width:40px;height:40px;flex:0 0 40px;margin-bottom:28px}
.auth-brand h1{font-size:1.65rem;font-weight:700;line-height:1.25;max-width:20ch;margin-bottom:14px}
.auth-brand .lead{font-size:.92rem;opacity:.88;max-width:40ch;line-height:1.65}

  messageCircle:'<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
  wifi:'<path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>',

};
function icon(n,c){return `<svg class="icon${c?' '+c:''}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;}
const LOGO = `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f766e"/></linearGradient></defs><rect width="40" height="40" rx="10" fill="url(#lg)"/><path d="M20 8 L30 12 V21 C30 27 25 31 20 33 C15 31 10 27 10 21 V12 Z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M20 15 V26 M15 20.5 H25" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>`;

/* ============ UTILS ============ */
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = n => String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const addDays = (iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
const fmtDate = iso => iso ? new Date(iso + 'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const fmtDT = iso => iso ? new Date(iso).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '—';
const relDue = iso => {
  const d = Math.round((new Date(iso+'T00:00:00') - new Date(todayISO()+'T00:00:00'))/86400000);
  if(d===0) return 'Today'; if(d===1) return 'Tomorrow'; if(d<0) return `${Math.abs(d)}d overdue`; return `in ${d}d`;
};
const hashPw = pw => { let h=5381; const s='vax$'+pw; for(let i=0;i<s.length;i++) h=((h<<5)+h)^s.charCodeAt(i); return 'h'+(h>>>0).toString(16); };
const genId = p => p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const genChildId = () => {
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let r='';
  for(let i=0;i<4;i++) r+=c[Math.floor(Math.random()*c.length)];
  return `VR-${new Date().getFullYear()}-${r}`;
};
let _toastTimer;
function toast(msg, type){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + (type||'ok');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = ''; }, 3400);
}
function openModal(html){ document.getElementById('modal-root').innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)App.closeModal()" role="dialog" aria-modal="true"><div class="modal">${html}</div></div>`; }
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

function priorityBadge(p){
  const m={urgent:['danger','Urgent'],high:['warn','High'],medium:['warn','Medium'],low:['gray','Low']};
  const [c,l]=m[p]||['gray',p];
  return `<span class="badge ${c}"><span class="dot"></span>${l}</span>`;
}
function statusBadge(s){
  const m={new:['info','New'],needs_verification:['violet','Needs Verification'],assigned:['brand','Assigned'],awaiting_response:['warn','Awaiting Response'],resolved:['ok','Resolved'],unable_to_confirm:['gray','Unable to Confirm'],completed:['ok','Completed'],overdue:['danger','Overdue'],due:['warn','Due soon'],upcoming:['gray','Upcoming'],offline_draft:['warn','Saved offline'],pending_sync:['warn','Waiting to sync'],pending_review:['info','Waiting for admin'],approved:['ok','Verified'],rejected:['danger','Changes requested']};
  const [c,l]=m[s]||['gray',s];
  return `<span class="badge ${c}"><span class="dot"></span>${l}</span>`;
}

/* ============ STORAGE ============ */
const KEY = 'vaxreach.data.v1';
const SESSION = 'vaxreach.session.v1';
const Store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } },
  save(db){ try { localStorage.setItem(KEY, JSON.stringify(db)); return true; } catch(e){ toast('Storage full — draft could not be saved', 'err'); return false; } },
  clear(){ localStorage.removeItem(KEY); localStorage.removeItem(SESSION); }
};

/* ============ SEED ============ */
const VACCINES = [
  {code:'BCG',ageDays:0},{code:'HepB0',ageDays:0},{code:'OPV0',ageDays:0},
  {code:'OPV1',ageDays:42},{code:'PENTA1',ageDays:42},{code:'PCV1',ageDays:42},{code:'ROTA1',ageDays:42},
  {code:'OPV2',ageDays:70},{code:'PENTA2',ageDays:70},{code:'PCV2',ageDays:70},{code:'ROTA2',ageDays:70},
  {code:'OPV3',ageDays:98},{code:'PENTA3',ageDays:98},{code:'PCV3',ageDays:98},{code:'IPV',ageDays:98},
  {code:'MR1',ageDays:274},{code:'MR2',ageDays:456}
];


const SAMPLE_CASE_FACTORS = {
  case_01:{overdue:90,repeatedMissed:80,contactDifficulty:80,accessBarrier:40},
  case_02:{overdue:80,repeatedMissed:60,contactDifficulty:55,accessBarrier:40},
  case_03:{overdue:70,repeatedMissed:50,contactDifficulty:50,accessBarrier:50},
  case_04:{overdue:90,repeatedMissed:80,contactDifficulty:80,accessBarrier:67},
  case_05:{overdue:60,repeatedMissed:20,contactDifficulty:50,accessBarrier:40},
  case_06:{overdue:80,repeatedMissed:60,contactDifficulty:75,accessBarrier:40}
};
function calculateFollowUpScore(f){
  const v=f||{};
  return Math.round((Number(v.overdue)||0)*.4+(Number(v.repeatedMissed)||0)*.25+
    (Number(v.contactDifficulty)||0)*.2+(Number(v.accessBarrier)||0)*.15);
}
function priorityForScore(n){ return n>=75?'urgent':n>=50?'high':n>=25?'medium':'low'; }
function caseTypeLabel(t){ return ({missed_session:'Missed vaccination follow-up',unreachable:'Could not reach your caregiver'})[t]||String(t||'Follow-up').replace(/_/g,' '); }
function childCaseStatusLabel(s){ return ({new:'Being reviewed',needs_verification:'Checking the details',assigned:'A health worker is following up',awaiting_response:'Waiting for a reply',resolved:'Completed',unable_to_confirm:'Could not confirm'})[s]||'Being reviewed'; }
function childCaseDescription(t){
  if(t==='missed_session') return 'A vaccination visit appears to have been missed. A health worker can check the record and help with the next step.';
  if(t==='unreachable') return 'The health team could not reach your trusted adult to confirm a detail. Ask them to contact the health worker if help is needed.';
  return 'A health worker is checking a detail in this record. Ask your trusted adult or contact the health team if something looks wrong.';
}
function childLoginEmail(id){ return id==='c_1'?'child@vaxreach.demo':id==='c_2'?'aahana@vaxreach.demo':id==='c_3'?'child2@vaxreach.demo':id+'@vaxreach.demo'; }
function migrateChildAccounts(db){
  const used=new Set();
  (db.children||[]).forEach(c=>{
    let u=db.users.find(x=>x.role==='child'&&x.id===c.accountId);
    if(!u) u=db.users.find(x=>x.role==='child'&&!used.has(x.id)&&String(x.name||'').toLowerCase()===String(c.name||'').toLowerCase());

async function restoreLocalOutbox(){
  const queued=await VaxReachRuntime.Outbox.all();
  let changed=false;
  for(const item of queued||[]){
    const existing=DB.vaccineDrafts.find(d=>d.id===item.id||d.clientDraftId===item.clientDraftId);
    const restored={...item,status:navigator.onLine?'pending_sync':'offline_draft'};
    if(existing) Object.assign(existing,restored);
    else DB.vaccineDrafts.unshift(restored);
    changed=true;
  }
  if(changed) save();
  return queued?.length||0;
}
async function migrateLocalDraftsToOutbox(user){
  if(!user||user.role!=='worker') return;
  for(const draft of DB.vaccineDrafts||[]){
    if(draft.workerId!==user.id||draft.serverId||!['offline_draft','pending_review','pending_sync'].includes(draft.status)) continue;
    draft.clientDraftId=draft.clientDraftId||draft.id;
    draft.status='pending_sync';
    await VaxReachRuntime.Outbox.put(draft);
  }
  save();
}

/* ============ RBAC ============ */
function scopeChildren(u){
  if(!u) return [];
  if(u.role==='admin') return DB.children.slice();
  if(u.role==='worker') return DB.children.filter(c=>c.assignedWorkerId===u.id);
  if(u.role==='child') return DB.children.filter(c=>c.accountId===u.id).slice(0,1);
  return [];
}
function scopeCases(u){
  const kids = new Set(scopeChildren(u).map(c=>c.id));
  return DB.cases.filter(c=>kids.has(c.childId));
}
function canAccessChild(u,child){
  if(!u||!child) return false;
  if(u.role==='admin') return true;
  if(u.role==='worker') return child.assignedWorkerId===u.id;
  if(u.role==='child') return child.accountId===u.id;
  return false;
}

function enrichChild(c){
  const sch = DB.schedules.filter(s=>s.childId===c.id);
  const pending = sch.filter(s=>!s.administeredDate).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const overdue = pending.filter(s=>s.dueDate < todayISO());
  const days = Math.max(0, Math.round((new Date(todayISO())-new Date(c.dob))/86400000));
  const ageText = days<31?days+'d':(days<365?Math.floor(days/30.44)+'mo':Math.floor(days/365)+'y');
  return {...c, ageText, doneCount:sch.filter(s=>s.administeredDate).length, totalCount:sch.length,
    overdueCount:overdue.length,
    nextDue: pending[0] ? {vaccineCode:pending[0].vaccineCode,dueDate:pending[0].dueDate} : null,
    status: overdue.length?'overdue':(pending.length?'due':'complete')};
}
function enrichCase(c){
  const child = DB.children.find(ch=>ch.id===c.childId);
  const worker = c.assignedTo ? DB.users.find(u=>u.id===c.assignedTo) : null;
  return {...c, childName:child?child.name:'—', childUniqueId:child?child.uniqueId:'—',
    community:child?child.community:'—', district:child?child.district:'—',
    assigneeName: worker?worker.name:null};
}

  mergeServerBootstrap(data){
    const oldUsers=DB.users||[];
    const oldChildren=DB.children||[];
    DB.users=(data.users||[]).map(serverUser=>{
      const previous=oldUsers.find(user=>user.id===serverUser.id);
      return {...previous,...serverUser,createdAt:serverUser.createdAt||previous?.createdAt||new Date().toISOString()};
    });
    let localUser=DB.users.find(user=>user.id===data.user.id);
    if(!localUser){localUser={...oldUsers.find(user=>user.id===data.user.id),...data.user,createdAt:new Date().toISOString()};DB.users.push(localUser);}
    else Object.assign(localUser,data.user);
    this.state.user=localUser;
    this.state.screen='app';
    setSession(localUser.id);
    DB.children=(data.children||[]).map(child=>({...oldChildren.find(old=>old.id===child.id),...child,createdAt:child.createdAt||oldChildren.find(old=>old.id===child.id)?.createdAt||new Date().toISOString()}));
    DB.households=(data.households||[]).map(household=>({...household}));
    DB.schedules=(data.schedules||[]).map(schedule=>({...schedule}));
    save();
  },

  async refreshServerBootstrap(){
    if(!navigator.onLine||!this.state.user) return;
    const data=await VaxReachRuntime.apiRequest('/api/v1/bootstrap');
    this.mergeServerBootstrap(data);
  },

  async finishPendingLogout(){
    if(localStorage.getItem('vaxreach.logoutPending')!=='1') return false;
    try{
      const sessionData=await VaxReachRuntime.apiRequest('/api/v1/auth/me');
      VaxReachRuntime.setCsrfToken(sessionData.csrfToken);
      await VaxReachRuntime.apiRequest('/api/v1/auth/logout',{method:'POST'});
      localStorage.removeItem('vaxreach.logoutPending');
    }catch(e){if(e.status===401)localStorage.removeItem('vaxreach.logoutPending');}
    return true;
  },

  async restoreServerSession(){
    if(await this.finishPendingLogout()){this.state.user=null;this.state.screen='landing';this.render();return;}
    try{
      const sessionData=await VaxReachRuntime.apiRequest('/api/v1/auth/me');
      VaxReachRuntime.setCsrfToken(sessionData.csrfToken);
      this.mergeServerBootstrap(await VaxReachRuntime.apiRequest('/api/v1/bootstrap'));
      await restoreLocalOutbox();
      await migrateLocalDraftsToOutbox(this.state.user);
      await this.syncOfflineVaccinationDrafts();
      await this.refreshServerDrafts();
    }catch(error){
      if(error.status===401){clearSession();this.state.user=null;this.state.screen='landing';}
    }
    this.render();
  },

  async refreshServerDrafts(){
    if(!navigator.onLine||!this.state.user) return;
    const data=await VaxReachRuntime.apiRequest('/api/v1/vaccination-drafts');
    const pendingLocal=(DB.vaccineDrafts||[]).filter(d=>['offline_draft','pending_sync'].includes(d.status));
    const remote=(data.drafts||[]).map(row=>({...row,id:row.id,serverId:row.id,clientDraftId:row.clientDraftId,createdAt:row.createdAt,updatedAt:row.updatedAt,syncedAt:row.syncedAt}));
    const merged=[...remote];
    for(const draft of pendingLocal){
      const index=merged.findIndex(item=>item.clientDraftId===draft.clientDraftId&&item.workerId===draft.workerId);
      if(index>=0)merged[index]={...merged[index],...draft};
      else merged.push(draft);
    }
    DB.vaccineDrafts=merged;
    save();
  },

  async refreshServerAudit(){
    if(!navigator.onLine||this.state.user?.role!=='admin')return;
    const data=await VaxReachRuntime.apiRequest('/api/v1/audit');
    DB.audit=(data.events||[]).map(event=>({...event,at:event.at}));
    save();
  },

  async syncOfflineVaccinationDrafts(){
    const user=this.state.user;
    if(!navigator.onLine||!user||user.role!=='worker') return 0;
    const queued=await VaxReachRuntime.Outbox.all();
    let synced=0;
    for(const item of queued||[]){
      if(item.workerId!==user.id) continue;
      try{
        const result=await VaxReachRuntime.apiRequest('/api/v1/vaccination-drafts',{method:'POST',body:{
          clientDraftId:item.clientDraftId||item.id,
          scheduleId:item.scheduleId,
          administeredDate:item.administeredDate,
          notes:item.notes||''
        }});
        const remote=result.draft;
        const local=DB.vaccineDrafts.find(d=>d.clientDraftId===(item.clientDraftId||item.id)||d.id===item.id);
        if(local) Object.assign(local,remote,{id:remote.id,serverId:remote.id,clientDraftId:remote.clientDraftId,status:remote.status});
        else DB.vaccineDrafts.unshift({...item,...remote,id:remote.id,serverId:remote.id});
        await VaxReachRuntime.Outbox.remove(item.id);
        synced++;
      }catch(error){
        if(error.status===401){clearSession();this.state.user=null;this.state.screen='landing';}
        else if(error.status===404||error.status===409||error.status===422) toast(error.message,'err');
        break;
      }
    }
    if(synced) save();
    this.state.pendingCount=(await VaxReachRuntime.Outbox.all()).filter(item=>item.workerId===user.id).length;
    return synced;
  },

  async saveOfflineVaccinationDraft(event){
    event.preventDefault();
    const user=this.state.user;
    if(!user||user.role!=='worker'){toast('Only health workers can submit vaccination drafts','err');return;}
    const form=event.currentTarget;
    const scheduleId=form.elements.scheduleId.value;
    const s=DB.schedules.find(x=>x.id===scheduleId);
    const child=s&&DB.children.find(x=>x.id===s.childId);
    const allowedChildren=new Set(scopeChildren(user).map(c=>c.id));
    if(!s||!child||!allowedChildren.has(child.id)||s.administeredDate){toast('Choose an eligible child and vaccine dose','err');return;}
    const administeredDate=form.elements.date.value;
    if(!administeredDate||administeredDate>todayISO()){toast('Enter a valid vaccination date','err');return;}
    const now=new Date().toISOString();
    const editing=this.state.offlineDraftEditId?DB.vaccineDrafts.find(d=>d.id===this.state.offlineDraftEditId&&d.workerId===user.id&&d.status==='rejected'):null;
    const duplicate=DB.vaccineDrafts.find(d=>d.scheduleId===s.id&&d.id!==editing?.id&&['offline_draft','pending_sync','pending_review','rejected'].includes(d.status));
    if(duplicate){toast('A draft for this scheduled dose is already waiting for review','err');return;}
    const previousDrafts=JSON.stringify(DB.vaccineDrafts);
    const values={scheduleId:s.id,childId:child.id,vaccineCode:s.vaccineCode,administeredDate,notes:form.elements.notes.value.trim(),workerId:user.id,workerName:user.name,status:'pending_sync',updatedAt:now,syncedAt:null,reviewNote:''};
    if(this.state.offlineDraftEditId&&!editing){toast('This draft can no longer be edited','err');this.state.offlineDraftEditId=null;this.render();return;}
    const clientDraftId=editing?.clientDraftId||editing?.id||genId('vd');
    const draft={...(editing||{}),id:editing?.id||clientDraftId,clientDraftId,...values,createdAt:editing?.createdAt||now,reviewedAt:null,reviewedBy:null};
    if(editing) Object.assign(editing,draft);
    else DB.vaccineDrafts.unshift(draft);
    try{await VaxReachRuntime.Outbox.put(draft);}
    catch(error){DB.vaccineDrafts=JSON.parse(previousDrafts);toast(error.message||'Offline draft storage is unavailable','err');this.render();return;}
    if(!save()){DB.vaccineDrafts=JSON.parse(previousDrafts);this.render();return;}
    this.state.offlineDraftEditId=null;
    this.state.params={};
    if(navigator.onLine){const synced=await this.syncOfflineVaccinationDrafts();await this.refreshServerDrafts().catch(()=>{});toast(synced?'Draft synced for administrator review':'Draft saved on this device; sync will retry');}
    else toast('Vaccination saved as an offline draft');
    this.render();
  },
  editOfflineVaccinationDraft(id){
    const d=DB.vaccineDrafts.find(x=>x.id===id&&x.workerId===this.state.user?.id&&x.status==='rejected');

  async approveVaccinationDraft(id){
    const user=this.state.user;
    if(!user||user.role!=='admin'){toast('Administrator access is required','err');return;}
    if(!navigator.onLine){toast('Reconnect before verifying drafts','err');return;}
    const draft=DB.vaccineDrafts.find(d=>d.id===id&&d.status==='pending_review');
    if(!draft?.serverId){toast('This draft is not on the server yet','err');return;}
    try{
      const result=await VaxReachRuntime.apiRequest(`/api/v1/vaccination-drafts/${encodeURIComponent(draft.serverId)}/review`,{method:'POST',body:{decision:'approved'}});
      if(result.schedule){const i=DB.schedules.findIndex(s=>s.id===result.schedule.id);if(i>=0)DB.schedules[i]=result.schedule;}
      await this.refreshServerDrafts();await this.refreshServerBootstrap();
      toast('Vaccination draft verified on the server');this.render();
    }catch(error){toast(error.message||'Could not verify the draft','err');}

    const user=this.state.user;
    if(!user||user.role!=='admin'){toast('Administrator access is required','err');return;}
    if(!navigator.onLine){toast('Reconnect before reviewing drafts','err');return;}
    const draft=DB.vaccineDrafts.find(d=>d.id===id&&d.status==='pending_review');
    if(!draft?.serverId){toast('This draft is not on the server yet','err');return;}
    const note=prompt('Enter the changes required before this vaccination can be verified:');

    if(!note.trim()){toast('Enter a reason for requesting changes','err');return;}
    try{
      await VaxReachRuntime.apiRequest(`/api/v1/vaccination-drafts/${encodeURIComponent(draft.serverId)}/review`,{method:'POST',body:{decision:'rejected',note:note.trim()}});
      await this.refreshServerDrafts();toast('Changes requested from the health worker');this.render();
    }catch(error){toast(error.message||'Could not submit the review','err');}
  },

    }[this.state.voiceLang];
    if(!child)this.state.voiceResponse=messages.noChild;

      const doses=DB.schedules.filter(d=>d.childId===child.id&&!d.administeredDate).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));

  initMap(){
    const el = document.getElementById('leaflet-map');
    if(!el || typeof L === 'undefined') return;
    if(window._map){ try { window._map.remove(); } catch(e){} window._map = null; }
    const map = L.map('leaflet-map').setView([20.3, 85.5], 8);
    window._map = map;
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles © Esri', maxZoom: 19
    }).addTo(map);
    const kids = scopeChildren(this.state.user);
    const hhIds = new Set(kids.map(c=>c.householdId));
    const bounds = [];
    DB.households.filter(h=>hhIds.has(h.id) && typeof h.lat === 'number').forEach(h => {
      const openCases = DB.cases.filter(c=>c.householdId===h.id && !['resolved','unable_to_confirm'].includes(c.status));
      const color = openCases.some(c=>c.priority==='urgent') ? '#dc2626' : openCases.length ? '#ea580c' : '#059669';
      const ic = L.divIcon({className:'', html:`<div style="width:16px;height:16px;background:${color};border:2px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.4)"></div>`, iconSize:[16,16], iconAnchor:[8,8]});
      L.marker([h.lat, h.lng], {icon:ic}).addTo(map).bindPopup(
        `<strong>${esc(h.head)}</strong><br><small>${esc(h.community)} · ${esc(h.district)}<br>Open cases: ${openCases.length}</small>`
      );
      bounds.push([h.lat, h.lng]);
    });
    if(bounds.length){ try { map.fitBounds(L.latLngBounds(bounds).pad(0.15)); } catch(e){} }
    setTimeout(()=>{ try { map.invalidateSize(); } catch(e){} }, 100);
  },

    const user=this.state.user;
    if(!user||!['admin','worker'].includes(user.role)) return '<div class="card card-pad">Access denied.</div>';
    if(user.role==='admin'){
      const waiting=DB.vaccineDrafts.filter(d=>d.status==='pending_review').sort((a,b)=>String(a.syncedAt||a.createdAt).localeCompare(String(b.syncedAt||b.createdAt)));
      const offline=DB.vaccineDrafts.filter(d=>d.status==='offline_draft');
      const reviewed=DB.vaccineDrafts.filter(d=>['approved','rejected'].includes(d.status)).sort((a,b)=>String(b.reviewedAt||'').localeCompare(String(a.reviewedAt||''))).slice(0,10);
      return `<div class="between" style="margin-bottom:16px"><div><h2>Vaccination review</h2><p class="muted small">Verify worker submissions before they update a child's schedule.</p></div></div>
        ${!navigator.onLine?`<div class="context-banner cb-warn"><div class="cb-ic">${icon('wifiOff')}</div><div><h4>Offline — review paused</h4><p>Reconnect before verifying submissions. Drafts saved offline move to this review queue when the connection returns.</p></div></div>`:''}
        <div class="context-banner cb-follow"><div class="cb-ic">${icon('shield')}</div><div><h4>Administrator verification</h4><p>Synced submissions are stored in the central database. Only administrator verification updates the vaccination schedule.</p></div></div>
        <div class="card"><div class="card-head"><h3>Waiting for review</h3><span class="badge info">${waiting.length}</span></div><div class="table-wrap"><table class="tbl">
          <thead><tr><th>Child</th><th>Vaccine</th><th>Date given</th><th>Health worker</th><th>Notes</th><th></th></tr></thead>
          <tbody>${waiting.map(d=>{const child=DB.children.find(c=>c.id===d.childId),worker=DB.users.find(w=>w.id===d.workerId);return `<tr><td>${esc(child?.name||'Unknown child')}</td><td>${esc(d.vaccineCode)}</td><td>${fmtDate(d.administeredDate)}</td><td>${esc(worker?.name||d.workerName||'Unknown worker')}</td><td>${esc(d.notes||'—')}</td><td><div class="row"><button class="btn sm" ${navigator.onLine?'':'disabled'} onclick="App.approveVaccinationDraft('${d.id}')">Verify</button><button class="btn ghost sm" ${navigator.onLine?'':'disabled'} onclick="App.requestVaccinationDraftChanges('${d.id}')">Request changes</button></div></td></tr>`}).join('')||'<tr><td colspan="6" class="muted">No submissions are waiting for administrator review.</td></tr>'}</tbody>
        </table></div></div>
        ${offline.length?`<div class="card mt16"><div class="card-head"><h3>Saved offline on this browser</h3><span class="badge warn">${offline.length}</span></div><div class="table-wrap"><table class="tbl"><thead><tr><th>Child</th><th>Vaccine</th><th>Health worker</th><th>Saved</th></tr></thead><tbody>${offline.map(d=>{const child=DB.children.find(c=>c.id===d.childId);return `<tr><td>${esc(child?.name||'Unknown child')}</td><td>${esc(d.vaccineCode)}</td><td>${esc(d.workerName||'Unknown worker')}</td><td>${fmtDT(d.createdAt)}</td></tr>`}).join('')}</tbody></table></div></div>`:''}
        ${reviewed.length?`<div class="card mt16"><div class="card-head"><h3>Recently reviewed</h3></div><div class="table-wrap"><table class="tbl"><thead><tr><th>Child</th><th>Vaccine</th><th>Status</th><th>Review note</th><th>Reviewed</th></tr></thead><tbody>${reviewed.map(d=>{const child=DB.children.find(c=>c.id===d.childId);return `<tr><td>${esc(child?.name||'Unknown child')}</td><td>${esc(d.vaccineCode)}</td><td>${statusBadge(d.status)}</td><td>${esc(d.reviewNote||'—')}</td><td>${fmtDT(d.reviewedAt)}</td></tr>`}).join('')}</tbody></table></div></div>`:''}`;
    }

    const childIds=new Set(scopeChildren(user).map(c=>c.id));
    const available=DB.schedules.filter(s=>childIds.has(s.childId)&&!s.administeredDate&&!DB.vaccineDrafts.some(d=>d.scheduleId===s.id&&d.id!==this.state.offlineDraftEditId&&['offline_draft','pending_sync','pending_review','rejected'].includes(d.status))).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
    const editing=this.state.offlineDraftEditId?DB.vaccineDrafts.find(d=>d.id===this.state.offlineDraftEditId&&d.workerId===user.id&&d.status==='rejected'):null;
    const selectedSchedule=editing?.scheduleId||this.state.params.scheduleId||'';
    const drafts=DB.vaccineDrafts.filter(d=>d.workerId===user.id).sort((a,b)=>String(b.updatedAt||b.createdAt).localeCompare(String(a.updatedAt||a.createdAt)));
    const options=available.map(s=>{const child=DB.children.find(c=>c.id===s.childId);return `<option value="${esc(s.id)}" ${s.id===selectedSchedule?'selected':''}>${esc(child?.name||'Unknown child')} · ${esc(s.vaccineCode)} · due ${fmtDate(s.dueDate)}</option>`}).join('');
    const rows=drafts.map(d=>{const child=DB.children.find(c=>c.id===d.childId);const action=d.status==='rejected'?`<button class="btn ghost sm" onclick="App.editOfflineVaccinationDraft('${d.id}')">Edit and resubmit</button>`:'';return `<tr><td>${esc(child?.name||'Unknown child')}</td><td>${esc(d.vaccineCode)}</td><td>${fmtDate(d.administeredDate)}</td><td>${statusBadge(d.status)}${d.reviewNote?`<div class="tiny muted" style="margin-top:5px">${esc(d.reviewNote)}</div>`:''}</td><td>${fmtDT(d.updatedAt||d.createdAt)}</td><td>${action}</td></tr>`}).join('');
    return `<div class="between" style="margin-bottom:16px"><div><h2>Offline vaccination drafts</h2><p class="muted small">Enter vaccination details on this page. Submissions remain drafts until an administrator verifies them.</p></div></div>
      ${navigator.onLine?`<div class="context-banner cb-follow"><div class="cb-ic">${icon('wifi')}</div><div><h4>Connection available</h4><p>New submissions sync to the central administrator review queue. The schedule changes only after verification.</p></div></div>`:`<div class="context-banner cb-warn"><div class="cb-ic">${icon('wifiOff')}</div><div><h4>Offline — drafts stay on this device</h4><p>Save vaccination details now. When internet returns, the drafts sync to the central administrator review queue.</p></div></div>`}
      <div class="card card-pad" style="margin-bottom:16px"><div class="between" style="margin-bottom:14px"><div><h3>${editing?'Edit vaccination draft':'Record vaccination'}</h3><p class="small muted">Select a child and scheduled vaccine dose. This form is the only place to enter vaccination details.</p></div></div>
        ${available.length?`<form onsubmit="App.saveOfflineVaccinationDraft(event)"><label class="field"><span>Child and vaccine dose</span><select name="scheduleId" required>${options}</select></label>
          <div class="form-grid"><label class="field"><span>Date administered</span><input type="date" name="date" value="${esc(editing?.administeredDate||todayISO())}" max="${todayISO()}" required /></label><label class="field"><span>Notes</span><textarea name="notes" rows="2">${esc(editing?.notes||'')}</textarea></label></div>
          <div class="row" style="justify-content:flex-end">${editing?'<button class="btn ghost" type="button" onclick="App.cancelOfflineVaccinationDraftEdit()">Cancel</button>':''}<button class="btn" type="submit">${navigator.onLine?'Submit for administrator review':'Save offline draft'}</button></div></form>`:`<div class="context-banner cb-warn" style="margin-bottom:0"><div class="cb-ic">${icon('info')}</div><div><h4>No eligible doses</h4><p>There are no unrecorded scheduled doses available for your assigned children.</p></div></div>`}
      </div>
      <div class="card"><div class="card-head"><h3>My vaccination submissions</h3><span class="badge gray">${drafts.length}</span></div><div class="table-wrap"><table class="tbl"><thead><tr><th>Child</th><th>Vaccine</th><th>Date given</th><th>Status</th><th>Last update</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="muted">No submissions yet. Use the form above to report a vaccination.</td></tr>'}</tbody></table></div></div>
      <div class="disclaimer-box mt16">Offline drafts remain on this device until the connection returns. Keep this browser's site data until each draft has synced and received an administrator decision.</div>`;
  },

  view_dashboard(){
    const u = this.state.user;
    if(u.role==='child'){
      const kids = scopeChildren(u);
      const child = kids[0];
      if(!child) return `<div class="card card-pad">No child record linked.</div>`;
      const ec = enrichChild(child);
      const cases = scopeCases(u).filter(c=>!['resolved','unable_to_confirm'].includes(c.status));
      const recent = DB.schedules.filter(s=>s.childId===child.id && s.administeredDate).slice(0,3);
      return `
        <div class="context-banner cb-follow"><div class="cb-ic">${icon('info')}</div><div><h4>Hello, ${esc(u.name.split(' ')[0])}</h4><p>Your VaxReach ID is <strong>${esc(child.uniqueId)}</strong>.</p></div></div>
        <div class="kpi-grid" style="margin-bottom:18px">
          <div class="kpi teal"><div class="k-top"><div class="k-ic">${icon('baby')}</div></div><div class="k-val">${ec.doneCount}/${ec.totalCount}</div><div class="k-lbl">Doses completed</div></div>
          <div class="kpi amber"><div class="k-top"><div class="k-ic">${icon('clock')}</div></div><div class="k-val">${ec.overdueCount}</div><div class="k-lbl">Overdue</div></div>
          <div class="kpi red"><div class="k-top"><div class="k-ic">${icon('clipboardCheck')}</div></div><div class="k-val">${cases.length}</div><div class="k-lbl">Open follow-ups</div></div>
        </div>
        <div class="cols-2">
          <div class="card"><div class="card-head"><h3>Recent vaccines</h3><button class="btn ghost sm" onclick="App.goto('child',{id:'${child.id}'})">View all</button></div>
            <div class="card-body">${recent.map(s=>`<div class="list-row"><div class="lr-main"><div class="lr-t">${esc(s.vaccineCode)}</div><div class="lr-s">Given ${fmtDate(s.administeredDate)}</div></div></div>`).join('') || '<p class="small muted">None yet.</p>'}</div>
          </div>
          <div class="card"><div class="card-head"><h3>My follow-ups</h3></div>
            <div class="card-body">${cases.map(c=>`<div class="list-row" style="cursor:pointer" onclick="App.goto('case',{id:'${c.id}'})"><div class="lr-main"><div class="lr-t">${esc(caseTypeLabel(c.type))}</div><div class="lr-s">${fmtDate(c.createdAt.slice(0,10))}</div></div>${statusBadge(c.status)}</div>`).join('') || '<p class="small muted">No open follow-ups.</p>'}</div>
          </div>
        </div>`;
    }
    const cases = scopeCases(u);
    const kids = scopeChildren(u);
    const open = cases.filter(c=>!['resolved','unable_to_confirm'].includes(c.status));
    const urgent = open.filter(c=>c.priority==='urgent');
    const covered = kids.length ? Math.round(kids.reduce((a,c)=>a+(enrichChild(c).doneCount/Math.max(1,enrichChild(c).totalCount)),0)/kids.length*100) : 0;
    return `
      <div class="kpi-grid" style="margin-bottom:18px">
        <div class="kpi teal"><div class="k-top"><div class="k-ic">${icon('baby')}</div></div><div class="k-val">${kids.length}</div><div class="k-lbl">Children</div></div>
        <div class="kpi orange"><div class="k-top"><div class="k-ic">${icon('clipboardCheck')}</div></div><div class="k-val">${open.length}</div><div class="k-lbl">Open cases</div></div>
        <div class="kpi red"><div class="k-top"><div class="k-ic">${icon('alert')}</div></div><div class="k-val">${urgent.length}</div><div class="k-lbl">Urgent</div></div>
        <div class="kpi green"><div class="k-top"><div class="k-ic">${icon('shield')}</div></div><div class="k-val">${covered}%</div><div class="k-lbl">Coverage</div></div>
      </div>
      <div class="card"><div class="card-head"><h3>Highest priority cases</h3><button class="btn ghost sm" onclick="App.goto('worklist')">Worklist</button></div>
        <div class="card-body">
          ${open.slice(0,5).map(c=>{const ec=enrichCase(c);return `<div class="list-row" style="cursor:pointer" onclick="App.goto('case',{id:'${c.id}'})"><div class="lr-main"><div class="lr-t">${esc(ec.childName)} — ${esc(c.type.replace(/_/g,' '))}</div><div class="lr-s">${esc(ec.community)} · ${esc(ec.assigneeName||'Unassigned')}</div></div>${priorityBadge(c.priority)}<span class="badge brand">${c.score}</span></div>`}).join('') || '<p class="small muted">All caught up.</p>'}
        </div>
      </div>`;
  },

  view_worklist(){
    const open = scopeCases(this.state.user).filter(c=>!['resolved','unable_to_confirm'].includes(c.status)).sort((a,b)=>b.score-a.score);
    return `<div class="context-banner cb-follow"><div class="cb-ic">${icon('target')}</div><div><h4>How follow-up scores work</h4><p>0–100 staff outreach ordering score = overdue schedule × 40% + repeated missed sessions × 25% + contact difficulty × 20% + access barriers × 15%. Priority bands: urgent 75–100, high 50–74, medium 25–49, low 0–24. Higher scores suggest earlier outreach; not a child's health score or diagnosis. Demo factors are fictional.</p></div></div>
      ${open.map(c=>{
        const f = c.factors||{};
        const ec = enrichCase(c);
        return `<div class="card card-pad" style="margin-bottom:12px">
          <div class="between">
            <div><div class="bold">${esc(ec.childName)} <span class="tiny muted">(${esc(ec.childUniqueId)})</span></div><div class="small muted">${esc(ec.community)} · ${esc(caseTypeLabel(c.type))} · ${esc(ec.assigneeName||'Unassigned')}</div></div>
            <div style="text-align:right">${priorityBadge(c.priority)}<div style="font-size:1.4rem;font-weight:700">${c.score}</div></div>
          </div>
          <div class="disclaimer-box" style="margin-top:12px">
            <strong>Why this score:</strong> Overdue ${f.overdue||0}×40% + Repeated missed ${f.repeatedMissed||0}×25% + Contact difficulty ${f.contactDifficulty||0}×20% + Access barriers ${f.accessBarrier||0}×15% = ${c.score} (rounded).
          </div>
          <div class="row" style="margin-top:10px;gap:8px"><button class="btn sm" onclick="App.goto('case',{id:'${c.id}'})">Open case</button></div>
        </div>`;
      }).join('') || '<div class="card card-pad"><p class="small muted">No open cases.</p></div>'}`;
  },

  view_cases(){
    const user=this.state.user,cases=scopeCases(user).map(enrichCase);
    if(user.role==='child') return `<div class="between" style="margin-bottom:16px"><div><h2>My Follow-ups</h2>
      <p class="muted small">A follow-up is a record the health team uses when a vaccination visit may have been missed, a contact needs checking, or someone needs help. It is not a diagnosis.</p></div></div>
      <div class="card"><div class="table-wrap"><table class="tbl"><thead><tr><th>What needs follow-up</th><th>Opened</th><th>Status</th><th></th></tr></thead>
      <tbody>${cases.map(c=>`<tr><td><div class="t-strong">${esc(caseTypeLabel(c.type))}</div><div class="tiny muted">${esc(childCaseDescription(c.type))}</div></td>
      <td>${fmtDate(c.createdAt.slice(0,10))}</td><td><span class="badge info">${esc(childCaseStatusLabel(c.status))}</span></td>
      <td><button class="btn ghost sm" onclick="App.goto('case',{id:'${c.id}'})">View</button></td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;padding:24px">No follow-ups are listed right now.</td></tr>'}</tbody>
      </table></div></div>`;
    return `<div class="between" style="margin-bottom:16px"><div><h2>Cases</h2><p class="muted small">Staff follow-up records. Scores help order outreach and never describe a child's health.</p></div></div>
      <div class="card"><div class="table-wrap"><table class="tbl"><thead><tr><th>Child</th><th>Follow-up</th><th>Status</th><th>Priority</th><th>Score ⓘ</th><th>Assigned</th><th></th></tr></thead>
      <tbody>${cases.map(c=>`<tr><td><div class="t-strong">${esc(c.childName)}</div><div class="tiny muted">${esc(c.childUniqueId)}</div></td>
      <td>${esc(caseTypeLabel(c.type))}</td><td>${statusBadge(c.status)}</td><td>${priorityBadge(c.priority)}</td>
      <td><span class="badge brand" title="0–100 outreach ordering score, not a health score.">${c.score}</span></td><td>${esc(c.assigneeName||'—')}</td>
      <td><button class="btn ghost sm" onclick="App.goto('case',{id:'${c.id}'})">Open</button></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;padding:24px">No cases.</td></tr>'}</tbody>
      </table></div></div>`;
  },

  view_case(){
    const id=this.state.params.id,c=DB.cases.find(x=>x.id===id);
    if(!c)return `<div class="card card-pad">Follow-up not found.</div>`;
    const u=this.state.user,childView=u.role==='child';
    if(childView&&!scopeChildren(u).some(ch=>ch.id===c.childId))return `<div class="card card-pad">Access denied.</div>`;
    const ec=enrichCase(c),isWorker=u.role==='admin'||u.role==='worker';
    const transitions={new:['needs_verification','unable_to_confirm'],needs_verification:['assigned','unable_to_confirm'],assigned:['awaiting_response','resolved','unable_to_confirm'],awaiting_response:['resolved','assigned','unable_to_confirm'],unable_to_confirm:['assigned'],resolved:[]}[c.status]||[];
    const history=DB.history.filter(h=>h.caseId===c.id).reverse(),notes=DB.notes.filter(n=>n.caseId===c.id).reverse();
    if(childView)return `<button class="btn ghost sm" onclick="App.goto('cases')" style="margin-bottom:14px">${icon('arrowLeft')} Back to follow-ups</button>
      <div class="card card-pad"><div class="between"><div><h2>${esc(caseTypeLabel(c.type))}</h2><p class="muted small">Opened ${fmtDate(c.createdAt.slice(0,10))}</p></div>
      <span class="badge info">${esc(childCaseStatusLabel(c.status))}</span></div><div class="divider"></div><h3>What this means</h3>
      <p class="small">${esc(childCaseDescription(c.type))}</p><div class="disclaimer-box" style="margin-top:14px">If this looks wrong, ask your trusted adult to contact the health team.</div>
      <button class="btn" style="margin-top:12px" onclick="App.goto('support')">Support & Contact</button></div>`;
    return `<button class="btn ghost sm" onclick="App.goto('cases')" style="margin-bottom:14px">${icon('arrowLeft')} Back</button>
      <div class="card card-pad" style="margin-bottom:16px"><div class="between"><div><h2>${esc(caseTypeLabel(c.type))}</h2>
      <p class="muted small">${esc(ec.childName)} · ${esc(ec.childUniqueId)} · ${esc(ec.community)}</p>
      <div class="row" style="margin-top:8px;gap:6px">${statusBadge(c.status)} ${priorityBadge(c.priority)}</div></div>
      <div style="text-align:right"><div style="font-size:2rem;font-weight:700">${c.score}</div><div class="tiny muted">follow-up score</div></div></div>
      <div class="disclaimer-box" style="margin-top:14px">This 0–100 score orders staff outreach only, not a child's health or diagnosis. Formula: overdue schedule × 40% + repeated missed sessions × 25% + contact difficulty × 20% + access barriers × 15%.</div>
      ${isWorker?`<div class="divider"></div><div class="row" style="gap:8px;flex-wrap:wrap">
      ${c.assignedTo===u.id?'<span class="badge brand">Assigned to you</span>':`<button class="btn sm" onclick="App.doAssignSelf('${c.id}')">Assign to me</button>`}
      ${transitions.map(t=>`<button class="btn ghost sm" onclick="App.doTransition('${c.id}','${t}')">Mark ${t.replace(/_/g,' ')}</button>`).join('')}</div>
      <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn ghost sm" onclick="App.openContactModal('${c.id}')">Log contact</button>
      <button class="btn ghost sm" onclick="App.openReasonModal('${c.id}')">Reason</button><button class="btn ghost sm" onclick="App.openNoteModal('${c.id}')">Add note</button>
      <button class="btn" onclick="App.openVisitModal('${c.id}')">Record visit</button></div>`:''}</div>
      <div class="cols-2"><div class="card"><div class="card-head"><h3>History</h3></div><div class="card-body"><div class="timeline">
      ${history.map(h=>`<div class="tl-item done"><div class="tl-t">${esc(h.action)}</div><div class="tl-s">${esc(h.actorName)} · ${fmtDT(h.at)}</div></div>`).join('')||'<p class="small muted">No history yet.</p>'}</div></div></div>
      <div>${notes.length?`<div class="card"><div class="card-head"><h3>Notes</h3></div><div class="card-body">
      ${notes.map(n=>`<div class="list-row"><div class="lr-main"><div class="lr-s">${fmtDT(n.at)} · ${esc(n.authorName)}</div><div>${esc(n.text)}</div></div></div>`).join('')}</div></div>`:''}</div></div>`;
  },

  view_children(){
    const user=this.state.user;
    if(user.role==='child'){
      const child=childRecordFor(user);
      if(!child)return `<div class="card card-pad">No vaccination record is linked to this account.</div>`;
      const schedule=DB.schedules.filter(d=>d.childId===child.id).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
      return `<div class="between" style="margin-bottom:16px"><div><h2>My Vaccinations</h2><p class="muted small">This account shows one child's record. A trusted adult can help contact the health team if anything looks wrong.</p></div></div>
        ${this.state.demoMode?`<div class="context-banner cb-warn"><div class="cb-ic">${icon('info')}</div><div><h4>Demo account</h4><p>These sample records are fictional and certificates are not official documents.</p></div></div>`:`<div class="context-banner cb-follow"><div class="cb-ic">${icon('info')}</div><div><h4>Central vaccination record</h4><p>This schedule is served from VaxReach's database. Official certificates require an approved issuing process.</p></div></div>`}
        <div class="card"><div class="table-wrap"><table class="tbl"><thead><tr><th>Vaccine</th><th>Date</th><th>Status</th><th>Certificate</th></tr></thead>
        <tbody>${schedule.map(d=>{const certificate=this.state.demoMode&&d.administeredDate;return `<tr><td>${esc(d.vaccineCode)}</td><td>${fmtDate(d.administeredDate||d.dueDate)}</td><td><div class="dose-status">${statusBadge(d.status)}${this.state.demoMode&&d.administeredDate?'<span class="badge ok" title="Demo record only">Demo</span>':''}</div></td><td><button class="btn ghost sm" type="button" ${certificate?`onclick="App.downloadVaccinationCertificate('${d.id}')"`:'disabled'}>${certificate?'Demo certificate':'Not configured'}</button></td></tr>`}).join('')||'<tr><td colspan="4">No schedule is listed.</td></tr>'}</tbody></table></div></div>
        <div class="disclaimer-box" style="margin-top:14px">${this.state.demoMode?'Demo schedule only; dates are not clinically verified.':'Vaccination dates and dose schedules must be entered and checked by authorised health staff.'}</div>`;
    }
    const kids=scopeChildren(user).map(enrichChild);
    const workers=DB.users.filter(u=>u.role==='worker'&&u.active);
    const households=DB.households;
    return `${user.role==='admin'?`<div class="card card-pad" style="margin-bottom:16px"><div class="between" style="margin-bottom:12px"><div><h3>Add a child record</h3><p class="small muted">Saved to the central database. Select an existing household or enter a new one.</p></div></div>
      <form onsubmit="App.createServerChild(event)"><div class="form-grid"><label class="field"><span>Child name</span><input name="name" required maxlength="120" /></label><label class="field"><span>Date of birth</span><input type="date" name="dob" max="${todayISO()}" required /></label>

        <div class="card-body"><div class="timeline">
          ${sch.map(s=>{
            const st = s.administeredDate ? 'completed' : (s.status==='upcoming'?'upcoming':(s.dueDate < todayISO() ? 'overdue' : 'due'));

  view_households(){
    const kids = scopeChildren(this.state.user);
    const hhIds = new Set(kids.map(c=>c.householdId));
    const rows = DB.households.filter(h=>hhIds.has(h.id)).map(h=>{
      const open = DB.cases.filter(c=>c.householdId===h.id && !['resolved','unable_to_confirm'].includes(c.status));
      const top = open.length ? Math.max(...open.map(c=>c.score)) : 0;
      const priority = open.some(c=>c.priority==='urgent') ? 'urgent' : top>=50?'high':top>=25?'medium':'low';
      return {...h, openCases:open.length, priority};
    });
    return `<div class="between" style="margin-bottom:16px"><h2>Households</h2></div>
      <div class="card"><div class="table-wrap"><table class="tbl">
        <thead><tr><th>Head</th><th>Community</th><th>District</th><th>Open cases</th><th>Priority</th></tr></thead>
        <tbody>${rows.map(h=>`<tr>
          <td><div class="t-strong">${esc(h.head)}</div><div class="tiny muted">${esc(h.address||'')}</div></td>
          <td>${esc(h.community)}</td>
          <td>${esc(h.district)}</td>
          <td>${h.openCases}</td>

  view_reports(){
    const f = this.state.reportFilters;
    const cases = scopeCases(this.state.user).filter(c=>{
      const d = c.createdAt.slice(0,10);
      return d>=f.from && d<=f.to;
    });
    const assigned = cases.filter(c=>c.assignedTo).length;
    const resolved = cases.filter(c=>c.status==='resolved').length;
    const unresolved = cases.filter(c=>!['resolved','unable_to_confirm'].includes(c.status)).length;
    const reasonCount = {};
    cases.forEach(c=>{ if(c.reason){ const r = DB.reasons.find(x=>x.id===c.reason); const l = r?r.label:c.reason; reasonCount[l]=(reasonCount[l]||0)+1; } });
    const maxReason = Math.max(1, ...Object.values(reasonCount));
    return `
      <div class="between" style="margin-bottom:16px"><h2>Reports</h2><button class="btn sm" onclick="App.exportCSV()">${icon('download')} Export CSV</button></div>
      <div class="card" style="margin-bottom:16px"><div class="card-body">
        <div class="row" style="gap:10px;flex-wrap:wrap">
          <label class="field" style="margin:0"><span>From</span><input type="date" value="${f.from}" onchange="App.setReportFilter('from', this.value)" /></label>
          <label class="field" style="margin:0"><span>To</span><input type="date" value="${f.to}" onchange="App.setReportFilter('to', this.value)" /></label>
        </div>
      </div></div>
      <div class="kpi-grid" style="margin-bottom:16px">
        <div class="kpi teal"><div class="k-top"><div class="k-ic">${icon('clipboardCheck')}</div></div><div class="k-val">${assigned}</div><div class="k-lbl">Assigned</div></div>
        <div class="kpi green"><div class="k-top"><div class="k-ic">${icon('check')}</div></div><div class="k-val">${resolved}</div><div class="k-lbl">Resolved</div></div>
        <div class="kpi red"><div class="k-top"><div class="k-ic">${icon('alert')}</div></div><div class="k-val">${unresolved}</div><div class="k-lbl">Unresolved</div></div>
      </div>
      <div class="card"><div class="card-head"><h3>Unresolved by reason</h3></div>
        <div class="card-body">
          ${Object.entries(reasonCount).map(([label,value])=>`<div class="bar-row"><div class="small bold">${esc(label)}</div><div class="bar-track"><div class="bar-fill warn" style="width:${(value/maxReason*100)}%"></div></div><div class="bar-val">${value}</div></div>`).join('') || '<p class="small muted">No reasons recorded.</p>'}
        </div>
      </div>`;
  },

  view_users(){
