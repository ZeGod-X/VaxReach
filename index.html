  view_capabilities(){
    const caps = [
      ['Browser persistence (localStorage)','LIVE','Data survives refresh and closes on this browser.'],
      ['Demo sign-in','DEMO','Simple hash comparison. NOT secure — production needs server bcrypt.'],
      ['Role-based views','DEMO','Enforced in browser. Bypassable via DevTools. Production needs server RBAC.'],
      ['Case workflow','LIVE','Assign, transition, reason, contact, visit, resolve. All work.'],
      ['Audit trail','LIVE','Local append-only log.'],
      ['Reports + CSV','LIVE','Real aggregate reports from local data.'],
      ['Geographic map','DEMO','Requires internet for tile server. Falls back to list.'],
      ['Family assistant','DEMO','Browser speech APIs. Text fallback always works.'],
      ['SMS delivery','SIMULATED','Messages stored locally. No real SMS sent.'],
      ['IVR calls','SIMULATED','Not implemented. UI stub only.'],
      ['U-WIN integration','MOCK','Sandbox only. Real needs MoHFW approval.'],
      ['Approved schedule','NEEDS APPROVAL','Current schedule is unverified demo data.']
    ];
    return `<div class="between" style="margin-bottom:16px"><h2>Capability matrix</h2></div>
      <div class="card card-pad">
        ${caps.map(([name,level,note])=>`
          <div class="cap-row">
            <div class="cap-name">${esc(name)}</div>
            <div><span class="badge ${level==='LIVE'?'tag-live':level==='DEMO'?'tag-demo':level==='MOCK'?'tag-mock':'tag-needs'}">${esc(level)}</span></div>
            <div class="cap-note">${esc(note)}</div>
          </div>`).join('')}
      </div>
      <div class="card card-pad" style="margin-top:16px">
        <h3 style="margin-bottom:12px">What's needed for production</h3>
        <ul class="small" style="line-height:1.8;margin:0;padding-left:20px">
          <li>Real backend (Node.js + SQLite or Postgres) for persistent multi-user data</li>
          <li>Server-side authentication with bcrypt/argon2 and HttpOnly cookies</li>
          <li>Server-enforced RBAC on every endpoint</li>
          <li>U-WIN API credentials from MoHFW with signed agreement</li>
          <li>DLT-registered SMS sender (TRAI) and telephony provider</li>
          <li>Approved immunisation schedule from state health authority</li>
          <li>HTTPS + CSP + rate limiting + CSRF tokens</li>
        </ul>
      </div>`;
  },

  view_settings(){
    if(this.state.user.role!=='admin') return '<div class="card card-pad">Access denied.</div>';
    return `<div class="between" style="margin-bottom:16px"><h2>Settings & data</h2></div>
      <div class="card card-pad" style="max-width:600px">
        <h3 style="margin-bottom:12px">Local data</h3>
        <p class="small muted" style="margin-bottom:12px">All data lives in this browser's localStorage. Clearing browser data will erase it.</p>
        <div class="kv" style="margin-bottom:16px">
          <div class="kv-i"><div class="k">Children</div><div class="v">${DB.children.length}</div></div>
          <div class="kv-i"><div class="k">Cases</div><div class="v">${DB.cases.length}</div></div>
          <div class="kv-i"><div class="k">Users</div><div class="v">${DB.users.length}</div></div>
        </div>
        <div class="row" style="gap:8px;flex-wrap:wrap">
          <button class="btn" onclick="App.exportJSON()">${icon('download')} Export JSON</button>
          <button class="btn danger" onclick="App.resetAll()">Reset to seed</button>
        </div>
        <div class="disclaimer-box" style="margin-top:16px"><strong>Demo only.</strong> Do not enter real patient information. This is a browser prototype, not a production health system.</div>
      </div>`;
  },

  view_voice(){
    const lang = this.state.voiceLang;
    return `<div class="context-banner cb-voice"><div class="cb-ic">${icon('mic')}</div><div><h4>Help Assistant</h4><p>Looks up this child's demo schedule and camp list, or opens support. Uses simple keyword matching; speech input and playback depend on browser support. Not medical advice.</p></div></div>
      <div class="voice-shell">
        <div class="card"><div class="card-head"><h3>Voice</h3></div>
          <div class="card-body">
            <div class="voice-lang">
              <button class="${lang==='en'?'active':''}" onclick="App.setVoiceLang('en')">English</button>
              <button class="${lang==='hi'?'active':''}" onclick="App.setVoiceLang('hi')">हिन्दी</button>
              <button class="${lang==='or'?'active':''}" onclick="App.setVoiceLang('or')">ଓଡ଼ିଆ</button>
            </div>
            <button class="voice-mic-btn" onclick="App.toggleMic()">${icon('mic')}</button>
            <div class="voice-transcript" style="margin-top:12px">${esc(this.state.voiceTranscript||'(nothing recognised)')}</div>
            <div class="voice-response">${esc(this.state.voiceResponse||'Ask about your next vaccination, a nearby camp, or getting help.')}</div>
            ${this.state.voiceAction==='support'?'<button class="btn sm" style="margin-top:10px" onclick="App.goto(\'support\')">Open Support & Contact</button>':''}
            <button class="btn ghost sm" style="margin-top:12px" onclick="App.clearVoice()">Clear</button>
          </div>
        </div>
        <div class="card"><div class="card-head"><h3>Text input</h3></div>
          <div class="card-body">
            <form onsubmit="App.askVoice(event)">
              <label class="field"><span>Question</span><textarea name="q" rows="3"></textarea></label>
              <button class="btn" type="submit">Ask</button>
            </form>
            <div class="divider"></div>
            <div class="row" style="gap:6px;flex-wrap:wrap">
              <button class="btn ghost sm" onclick="App.askSuggestion('When is my next vaccination?')">Next vaccination</button>
              <button class="btn ghost sm" onclick="App.askSuggestion('Where is the nearest camp?')">Nearby camp</button>
              <button class="btn ghost sm" onclick="App.askSuggestion('I missed a session and need help')">Get help</button>
            </div>
          </div>
        </div>
      </div>`;
  },

  view_profile(){
    const u = this.state.user;
    const editing = this.state.profileEditing;
    const roleNames = {admin:'Administrator',worker:'Health Worker',child:'Child'};
    const field = (label,value,name,editable,type='text') => editing && editable
      ? `<label class="field profile-edit-field"><span>${esc(label)}</span><input type="${type}" name="${name}" value="${esc(value||'')}" ${label==='Name'?'required':''} /></label>`
      : `<div class="profile-item"><div class="profile-label">${esc(label)}</div><div class="profile-value">${esc(value===0?0:(value||'—'))}</div></div>`;
    const section = (title,fields) => `<section class="profile-section"><h3>${esc(title)}</h3><div class="profile-grid">${fields.join('')}</div></section>`;
    const readonlyField = (label,value) => field(label,value,null,false);
    const accountFields = [
      field('Name',u.name,'name',this.state.demoMode||u.role!=='child'),
      readonlyField('Email',u.email),
      readonlyField('Account type',roleNames[u.role]||u.role),
      readonlyField('Account status',u.active?'Active':'Disabled'),
      readonlyField('Member since',u.createdAt?fmtDate(u.createdAt.slice(0,10)):'—')
    ];
    let detailSections = '';

    if(u.role==='child'){
      const child = childRecordFor(u);
      if(child){
        const household = DB.households.find(h=>h.id===child.householdId);
        const worker = DB.users.find(w=>w.id===child.assignedWorkerId);
        const info = enrichChild(child);
        const childFields = [
          readonlyField('VaxReach ID',child.uniqueId),
          readonlyField('Date of birth',fmtDate(child.dob)),
          readonlyField('Age',info.ageText),
          readonlyField('Sex',child.sex),
          readonlyField('Community',child.community),
          readonlyField('District',child.district),
          field('Trusted adult / guardian',child.guardianName||household?.head,'guardianName',true),
          field('Trusted adult contact',child.phone||u.phone,'phone',true,'tel'),
          readonlyField('Household address',household?.address),
          readonlyField('Assigned health worker',worker?.name),
          readonlyField('Health worker facility',worker?.facility)
        ];
        detailSections = section('Child and vaccination record',childFields);
      }else{
        detailSections = `<section class="profile-section"><h3>Child record</h3><p class="small muted">No child record is linked to this account yet.</p></section>`;
      }
    }else if(u.role==='worker'){
      const assignedChildren = DB.children.filter(c=>c.assignedWorkerId===u.id);
      const openCases = DB.cases.filter(c=>c.assignedTo===u.id&&!['resolved','unable_to_confirm'].includes(c.status));
      const communities = [...new Set(assignedChildren.map(c=>c.community).filter(Boolean))].join(', ')||'—';
      const districts = [...new Set(assignedChildren.map(c=>c.district).filter(Boolean))].join(', ')||'—';
      const workFields = [
        field('Phone',u.phone,'phone',true,'tel'),
        field('Facility',u.facility,'facility',true),
        readonlyField('Assigned children',assignedChildren.length),
        readonlyField('Open assigned follow-ups',openCases.length),
        readonlyField('Communities',communities),
        readonlyField('Districts',districts),
        readonlyField('Assigned child records',assignedChildren.map(c=>`${c.name} (${c.uniqueId})`).join(', ')||'None assigned')
      ];
      accountFields.push(field('Phone',u.phone,'phone',true,'tel'),field('Facility',u.facility,'facility',true));
      detailSections = section('Work profile',workFields.slice(2));
    }else{
      const activeUsers = DB.users.filter(x=>x.active).length;
      const adminFields = [
        field('Phone',u.phone,'phone',true,'tel'),
        field('Facility / organisation',u.facility,'facility',true),
        readonlyField('Active accounts managed',activeUsers),
        readonlyField('Child records',DB.children.length),
        readonlyField('Follow-up records',DB.cases.length)
      ];
      accountFields.push(...adminFields.slice(0,2));
      detailSections = section('Administration overview',adminFields.slice(2));
    }

    const formOpen = editing?'<form onsubmit="App.saveProfile(event)" autocomplete="off">':'';
    const formClose = editing?'<div class="profile-actions"><button class="btn" type="submit">Save changes</button><button class="btn ghost" type="button" onclick="App.cancelProfileEdit()">Cancel</button></div></form>':'';
    return `<div class="between" style="margin-bottom:16px"><div><h2>My profile</h2><p class="small muted">Your account and role details are shown below.</p></div></div>
      <div class="card card-pad profile-panel">
        <div class="profile-summary">
          <div class="profile-person"><div class="profile-avatar">${esc(initials(u.name))}</div><div><h3>${esc(u.name)}</h3><div class="muted">${esc(roleNames[u.role]||u.role)} · ${esc(u.email)}</div></div></div>
          ${editing?'':`<button type="button" class="btn ghost" onclick="App.toggleProfileEdit()">Edit profile</button>`}
        </div>
        ${formOpen}
        ${section('Account details',accountFields)}
        ${detailSections}
        ${formClose}
        ${editing?'':`<div class="profile-actions"><button class="btn ghost" onclick="App.doLogout()">Sign out</button></div>`}
      </div>`;
  }
};

/* ============ NAV ============ */
const NAV = {
  admin:[
    ['dashboard','Dashboard','grid'],['worklist','Worklist','target'],['cases','Cases','clipboardCheck'],
    ['children','Children','baby'],['households','Households','home'],['map','GeoReach','map'],
    ['camps','Camps','layers'],['reports','Reports','chart'],['offline','Vaccination review','shield'],['audit','Audit','eye'],
    ['users','Users','users'],['schedule','Schedule','syringe'],['integrations','Integrations','info'],
    ['capabilities','Capabilities','info'],['settings','Settings','settings'],['profile','Profile','person']
  ],
  worker:[
    ['dashboard','Dashboard','grid'],['worklist','Worklist','target'],['cases','Cases','clipboardCheck'],
    ['children','Children','baby'],['offline','Offline drafts','wifiOff'],['households','Households','home'],['map','GeoReach','map'],
    ['camps','Camps','layers'],['support','Support inbox','messageCircle'],['messages','Messages','send'],
    ['voice','Voice','mic'],['capabilities','Capabilities','info'],['profile','Profile','person']
  ],
  child:[
    ['dashboard','Dashboard','grid'],['children','My Vaccinations','syringe'],
    ['cases','My Follow-ups','clipboardCheck'],['support','Support & Contact','messageCircle'],
    ['camps','Nearby Camps','layers'],['voice','Help Assistant','mic'],['profile','Profile','person']
  ]
};

/* ============ BOOT ============ */
App.init();
</script>
</body>
</html>
