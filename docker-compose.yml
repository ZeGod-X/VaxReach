services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaxreach
      POSTGRES_USER: vaxreach
      POSTGRES_PASSWORD: vaxreach-local
    ports:
      - "5432:5432"
    volumes:
      - vaxreach_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaxreach -d vaxreach"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://vaxreach:vaxreach-local@db:5432/vaxreach
      SESSION_SECRET: local-development-only-change-this-secret-before-deploy
      COOKIE_SECURE: "false"
      DEMO_MODE: "true"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed && npm start"]

volumes:
  vaxreach_postgres:
